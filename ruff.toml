# Lint and format configuration for the Pythia toolkit.
#
# The toolkit follows the line length of Pythia's own CODINGSTYLE, 79
# columns, so that it reads like the program it fronts. The scope is the
# directories the toolkit comprises; the rest of the repository is not
# yet held to this limit.
#
#   ruff check            report violations
#   ruff format           apply the layout

line-length = 79
include = [
  "tools/pythia/**/*.py",
  "tools/rivet/**/*.py",
  "tools/sherpa/**/*.py",
  "tools/cpp/**/*.py",
  "tools/events/**/*.py",
  "tools/event_io.py",
  "tools/tests/**/*.py",
  "skills/pythia/references/*.py",
]

[lint]
# Pyflakes, the pycodestyle errors that are not layout, and line length.
select = ["F", "E4", "E7", "E9", "E501", "W"]

[lint.per-file-ignores]
# Package __init__ files re-export their modules' public names.
"tools/*/__init__.py" = ["F401"]
# Test modules and the YODA dump script put the repository on sys.path
# before importing from it.
"tools/**/test_*.py" = ["E402"]
"tools/tests/*.py" = ["E402"]
"tools/rivet/yoda_dump.py" = ["E402"]
