      panel), with an HTML gallery.
    bundle: rivet
  - module: tools.rivet.merge
    name: RivetMergeTool
    description: Merge the YODA outputs of independent Rivet runs (different
      seeds or processes) with rivet-merge.
    bundle: rivet
  - module: tools.cernMkdocs.answer_tool
    name: CernDocsAnswerTool
